name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (format, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système d'egui
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: PDFium
        run: ./scripts/fetch-pdfium.sh linux-x64
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (tests, paquet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: PDFium
        run: ./scripts/fetch-pdfium.ps1
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Paquet portable
        run: ./packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: filigrane-pdf-windows-x64
          path: dist/*
